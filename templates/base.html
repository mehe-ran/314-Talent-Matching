<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Intelligent Talent Matching Platform{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0d6efd;
            --background-base: #f8f9fa;
            --surface-white: #ffffff;
            --text-dark: #212529;
            --success-green: #198754;
        }

        body {
            background: var(--background-base);
            color: var(--text-dark);
            font-family: 'Inter', sans-serif;
        }

        .app-shell {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar-brand {
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .auth-card {
            background: var(--surface-white);
            border: 0;
            border-radius: 1rem;
            box-shadow: 0 1rem 2.5rem rgba(33, 37, 41, 0.08);
        }

        .form-control:focus,
        .form-select:focus {
            border-color: rgba(13, 110, 253, 0.35);
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.12);
        }

        .section-kicker {
            color: var(--primary-blue);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .content-panel {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 1));
            border: 1px solid rgba(33, 37, 41, 0.08);
            border-radius: 1.25rem;
            box-shadow: 0 1rem 2rem rgba(33, 37, 41, 0.06);
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <nav class="navbar navbar-light bg-white border-bottom">
            <div class="container py-2">
                <a class="navbar-brand text-primary" href="#">Intelligent Talent Matching</a>
            </div>
        </nav>

        <main class="flex-grow-1 d-flex align-items-center py-5">
            <div class="container">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
