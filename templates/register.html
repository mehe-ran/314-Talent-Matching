{% extends "base.html" %}

{% block title %}Register | Intelligent Talent Matching Platform{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-10 col-lg-6">
        <div class="auth-card p-4 p-md-5">
            <div class="mb-4">
                <div class="section-kicker mb-2">Create account</div>
                <h1 class="h3 mb-2">Get started</h1>
                <p class="text-muted mb-0">Register to access matching tools and role-based dashboards.</p>
            </div>

            <form method="post" action="/register">
                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <label for="full_name" class="form-label">Full name</label>
                        <input type="text" class="form-control form-control-lg" id="full_name" name="full_name" placeholder="Jane Doe" required>
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="you@example.com" required>
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Create a password" required>
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="user_type" class="form-label">Account type</label>
                        <select class="form-select form-select-lg" id="user_type" name="user_type" required>
                            <option value="" selected disabled>Select a role</option>
                            <option value="candidate">Candidate</option>
                            <option value="employer">Employer</option>
                        </select>
                    </div>
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-primary btn-lg w-100">Create account</button>
                </div>
            </form>

            <div class="mt-4 text-center">
                <span class="text-muted">Already have an account?</span>
                <a href="/login" class="text-decoration-none fw-semibold">Log in</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
