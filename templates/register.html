{% extends "base.html" %}

{% block title %}Create an Account | TalentMatch{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-10 col-lg-6">
        <div class="card auth-card p-4 p-md-5">
            <div class="text-center mb-5">
                <div class="section-kicker mb-2">Registration</div>
                <h1 class="fw-bold mb-2">Join TalentMatch</h1>
                <p class="text-muted">Start your journey towards a better career or a stronger team.</p>
            </div>

            <form method="post" action="/register">
                <div class="row g-4">
                    <div class="col-12">
                        <label class="form-label fw-semibold">I am a...</label>
                        <div class="d-flex gap-3">
                            <input type="radio" class="btn-check" name="user_type" id="type_candidate" value="candidate" checked required>
                            <label class="btn btn-outline-primary flex-grow-1 p-3" for="type_candidate">
                                <i class="fas fa-user-graduate d-block mb-2 fa-lg"></i>
                                Candidate
                            </label>

                            <input type="radio" class="btn-check" name="user_type" id="type_employer" value="employer" required>
                            <label class="btn btn-outline-primary flex-grow-1 p-3" for="type_employer">
                                <i class="fas fa-building d-block mb-2 fa-lg"></i>
                                Employer
                            </label>
                        </div>
                    </div>

                    <div class="col-12">
                        <label for="full_name" class="form-label fw-semibold">Full Name / Company Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="fas fa-user text-muted"></i></span>
                            <input type="text" class="form-control border-start-0" id="full_name" name="full_name" placeholder="John Doe or Acme Inc." required>
                        </div>
                    </div>

                    <div class="col-12">
                        <label for="email" class="form-label fw-semibold">Email address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                            <input type="email" class="form-control border-start-0" id="email" name="email" placeholder="you@example.com" required>
                        </div>
                    </div>

                    <div class="col-12">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="fas fa-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="Create a strong password" required minlength="6">
                        </div>
                        <div class="form-text mt-2">At least 6 characters long.</div>
                    </div>

                    <div class="col-12">
                        <button type="submit" class="btn btn-primary btn-lg w-100 mt-3 py-3">
                            Create Account <i class="fas fa-arrow-right ms-2"></i>
                        </button>
                    </div>
                </div>
            </form>

            <div class="mt-5 text-center">
                <span class="text-muted">Already have an account?</span>
                <a href="/login" class="text-decoration-none fw-bold ms-1">Sign in here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
