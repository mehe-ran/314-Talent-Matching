{% extends "base.html" %}

{% block title %}Edit Profile{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-10 col-lg-8">
        <div class="card p-4 p-md-5">
            <h1 class="h3 mb-4">Edit Your Profile</h1>
            <form method="post" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="full_name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="full_name" name="full_name" value="{{ candidate.full_name }}">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" value="{{ candidate.email }}" readonly>
                    <div class="form-text">Your email address cannot be changed.</div>
                </div>
                <div class="mb-3">
                    <label for="location" class="form-label">Location</label>
                    <input type="text" class="form-control" id="location" name="location" value="{{ candidate.location or '' }}">
                </div>
                 <div class="mb-3">
                    <label for="preferred_work_mode" class="form-label">Preferred Work Mode</label>
                    <select class="form-select" name="preferred_work_mode" id="preferred_work_mode">
                        <option value="On-site" {% if candidate.preferred_work_mode == 'On-site' %}selected{% endif %}>On-site</option>
                        <option value="Remote" {% if candidate.preferred_work_mode == 'Remote' %}selected{% endif %}>Remote</option>
                        <option value="Hybrid" {% if candidate.preferred_work_mode == 'Hybrid' %}selected{% endif %}>Hybrid</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="resume" class="form-label">Upload Resume</label>
                    <input class="form-control" type="file" id="resume" name="resume">
                    {% if candidate.resume_filename %}
                        <div class="form-text">Current resume: <a href="{{ url_for('download_resume', filename=candidate.resume_filename) }}">{{ candidate.resume_filename }}</a></div>
                    {% endif %}
                </div>

                <button type="submit" class="btn btn-primary">Save Changes</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
