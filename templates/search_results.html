<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Search Results - Talent Matching</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom Styles -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8F9FA; /* Background Base */
            color: #212529; /* Text Dark (Primary) */
        }
        .navbar {
            box-shadow: 0 2px 4px rgba(0,0,0,.04);
        }
        .card {
            border: none;
            box-shadow: 0 4px 8px rgba(0,0,0,.05);
        }
        .btn-primary {
            background-color: #0D6EFD; /* Primary Action Blue */
            border-color: #0D6EFD;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">TalentMatch</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('candidate_dashboard') }}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Profile</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <h1 class="h2 mb-4">Search for Jobs</h1>

        <!-- Search Form -->
        <div class="card mb-4">
            <div class="card-body">
                <form action="{{ url_for('search') }}" method="get">
                    <div class="row g-3 align-items-end">
                        <div class="col-md-4">
                            <label for="keywords" class="form-label">Keywords</label>
                            <input type="text" class="form-control" id="keywords" name="keywords" placeholder="Job title, keywords..." value="{{ search_keywords or '' }}">
                        </div>
                        <div class="col-md-4">
                            <label for="location" class="form-label">Location</label>
                            <input type="text" class="form-control" id="location" name="location" placeholder="City, state, or remote" value="{{ search_location or '' }}">
                        </div>
                        <div class="col-md-4">
                            <label for="work_mode" class="form-label">Work Mode</label>
                            <select class="form-select" name="work_mode" id="work_mode">
                                <option value="">Any</option>
                                <option value="On-site" {% if search_work_mode == 'On-site' %}selected{% endif %}>On-site</option>
                                <option value="Remote" {% if search_work_mode == 'Remote' %}selected{% endif %}>Remote</option>
                                <option value="Hybrid" {% if search_work_mode == 'Hybrid' %}selected{% endif %}>Hybrid</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="job_type" class="form-label">Job Type</label>
                            <select class="form-select" name="job_type" id="job_type">
                                <option value="">Any</option>
                                <option value="Full-time">Full-time</option>
                                <option value="Part-time">Part-time</option>
                                <option value="Contract">Contract</option>
                                <option value="Internship">Internship</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="experience" class="form-label">Max Experience (Yrs)</label>
                            <input type="number" class="form-control" name="experience" id="experience" min="0">
                        </div>
                        <div class="col-md-3">
                             <label for="salary" class="form-label">Min Salary</label>
                            <input type="number" class="form-control" name="salary" id="salary" min="0">
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary w-100">Find Jobs</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Search Results -->
        <div class="card">
            <div class="card-header bg-white">
                <h5 class="mb-0">Search Results</h5>
            </div>
            <div class="card-body">
                {% if jobs %}
                    <div class="list-group list-group-flush">
                        {% for job in jobs %}
                            <a href="#" class="list-group-item list-group-item-action">
                                <div class="d-flex w-100 justify-content-between">
                                    <h6 class="mb-1">{{ job.job_title }}</h6>
                                    <small>{{ job.location }}</small>
                                </div>
                                <p class="mb-1 text-muted">{{ job.employer.company_name }}</p>
                            </a>
                        {% endfor %}
                    </div>
                {% else %}
                    <p class="text-center text-muted">No jobs found matching your criteria. Try a different search.</p>
                {% endif %}
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
