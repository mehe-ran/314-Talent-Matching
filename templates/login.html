{% extends "base.html" %}

{% block title %}Login | Intelligent Talent Matching Platform{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
        <div class="auth-card p-4 p-md-5">
            <div class="mb-4">
                <div class="section-kicker mb-2">Authentication</div>
                <h1 class="h3 mb-2">Welcome back</h1>
                <p class="text-muted mb-0">Sign in to continue to your dashboard.</p>
            </div>

            <form method="post" action="/login">
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100">Log in</button>
            </form>

            <div class="mt-4 text-center">
                <span class="text-muted">New here?</span>
                <a href="/register" class="text-decoration-none fw-semibold">Create an account</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
